      document.body.appendChild(d);
      const v = () => [document.getElementById('lemail').value.trim(), document.getElementById('lpass').value];
      const m = (t) => { document.getElementById('lmsg').textContent = t; };
      const lim = (e) => /rate|limit|security purposes/i.test(e.message);
      document.getElementById('lf').addEventListener('submit', async (e) => {
        e.preventDefault(); const [email, password] = v(); m('Вхожу…');
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) m(/confirm/i.test(error.message) ? 'Почта ещё не подтверждена: откройте письмо от Supabase и нажмите ссылку, потом войдите здесь.' : 'Неверная почта или пароль. Если пароля нет — нажмите «Создать аккаунт» или вход по ссылке.');
      });
      document.getElementById('lreg').onclick = async () => {
        const [email, password] = v();
        if (!email || password.length < 6) { m('Впишите почту и пароль не короче 6 символов.'); return; }
        m('Создаю аккаунт…');
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split('#')[0] } });
        if (error) { m(lim(error) ? 'Слишком много писем подряд — подождите около часа.' : 'Не получилось: ' + error.message); return; }
        if (data.session) return;
        m('Аккаунт создан. На ' + email + ' пришло письмо — нажмите в нём ссылку один раз. После этого входите здесь по почте и паролю, письма больше не нужны.');
      };
      document.getElementById('llink').onclick = async () => {
        const [email] = v();
        if (!email) { m('Сначала впишите почту.'); return; }
        m('Отправляю ссылку…');
        const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
        m(error ? (lim(error) ? 'Слишком много писем подряд — подождите около часа.' : 'Не получилось: ' + error.message) : 'Ссылка отправлена на ' + email + '. Откройте её — после входа задайте пароль кнопкой «Пароль» вверху.');
      };
    };
    document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', go) : go();

  // ---------- база: таблица docs (path, col, data)
  const cache = new Map();           // path -> { col, data }
  const colSubs = new Map();         // col -> Set(cb)
  const docSubs = new Map();         // path -> Set(cb)
  let loaded = null;

  const snapDoc = (path) => {
    const v = cache.get(path);
    return { id: path.split('/').pop(), exists: !!v, data: () => (v ? v.data : undefined), metadata: { fromCache: false, hasPendingWrites: false } };
  };
  const snapCol = (col) => {
    const docs = [...cache.entries()].filter(([, v]) => v.col === col).map(([p]) => snapDoc(p));
    return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] };
  };
  function notify(path) {
    const col = path.split('/').slice(0, -1).join('/');
    colSubs.get(col)?.forEach((cb) => cb(snapCol(col)));
    docSubs.get(path)?.forEach((cb) => cb(snapDoc(path)));
  }
  function load() {
    if (loaded) return loaded;
    loaded = (async () => {
      await allowed;
      const { data, error } = await sb.from('docs').select('path,col,data');
      if (error) throw { code: 'unavailable', message: error.message };
      data.forEach((r) => cache.set(r.path, { col: r.col, data: r.data }));
      sb.channel('docs-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, (p) => {
          if (p.eventType === 'DELETE') { const path = p.old?.path; if (path) { cache.delete(path); notify(path); } }
          else { cache.set(p.new.path, { col: p.new.col, data: p.new.data }); notify(p.new.path); }
        })
        .subscribe();
    })();
    return loaded;
  }
  const isObj = (x) => x && typeof x === 'object' && !Array.isArray(x);
  function merge(a, b) {
    const out = { ...(a || {}) };
    for (const k in b) {
      const v = b[k];
      if (isObj(v) && v.__delete__) delete out[k];
      else out[k] = isObj(v) && isObj(out[k]) ? merge(out[k], v) : isObj(v) ? merge({}, v) : v;
    }
    return out;
  }
  async function put(path, data) {
    const col = path.split('/').slice(0, -1).join('/');
    const prev = cache.get(path);
    cache.set(path, { col, data }); notify(path);
    const { error } = await sb.from('docs').upsert({ path, col, data });
    if (error) { prev ? cache.set(path, prev) : cache.delete(path); notify(path); throw { code: 'invalid_argument', message: error.message }; }
  }
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function doc(path) {
    return {
      id: path.split('/').pop(), path,
      async get() { await load(); return snapDoc(path); },
      async set(o) { await load(); return put(path, merge({}, o)); },
      async update(o) { await load(); const v = cache.get(path); if (!v) throw { code: 'invalid_argument', message: 'нет документа' }; return put(path, merge(v.data, o)); },
      async delete() {
        await load(); const prev = cache.get(path); cache.delete(path); notify(path);
        const { error } = await sb.from('docs').delete().eq('path', path);
        if (error) { if (prev) cache.set(path, prev); notify(path); throw { code: 'invalid_argument', message: error.message }; }
      },
      onSnapshot(cb, err) {
        if (!docSubs.has(path)) docSubs.set(path, new Set());
        docSubs.get(path).add(cb);
        load().then(() => cb(snapDoc(path))).catch((e) => err && err(e));
        return () => docSubs.get(path)?.delete(cb);
      },
    };
  }
  function collection(col) {
    return {
      path: col,
      doc: (id) => doc(col + '/' + (id || rid())),
      async add(o) { const d = doc(col + '/' + rid()); await d.set(o); return d; },
      async get() { await load(); return snapCol(col); },
      onSnapshot(cb, err) {
        if (!colSubs.has(col)) colSubs.set(col, new Set());
        colSubs.get(col).add(cb);
        load().then(() => cb(snapCol(col))).catch((e) => err && err(e));
        return () => colSubs.get(col)?.delete(cb);
      },
    };
  }
  const db = { doc, collection };

  // ---------- сканы: Supabase Storage, закрытый bucket «files»
  const assets = {
    async upload(file) {
      const safe = file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
      const path = new Date().toISOString().slice(0, 10) + '/' + rid() + '_' + safe;
      const { error } = await sb.storage.from('files').upload(path, file, { contentType: file.type || undefined });
      if (error) throw { code: 'invalid_argument', message: error.message };
      return { id: path, url: '', sizeBytes: file.size, contentType: file.type };
    },
  };
  // ссылка на файл открывается через временную подписанную ссылку
  document.addEventListener('click', async (e) => {

    if (!a) return;

    const { data, error } = await sb.storage.from('files').createSignedUrl(a.dataset.file, 3600);
    if (error || !data) { w && w.close(); alert('Не удалось открыть файл'); return; }
    if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
  }, true);

  // ---------- скачивание файлов Word
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
  };

  // ---------- кто вошёл + кнопка «Выйти»
  const user = {
    async id() { const s = await ready; return s.user.id; },
    async can() { return true; },
  };
  ready.then((s) => {
    const add = () => {
      const h = document.querySelector('header .wrap');
      if (!h || document.getElementById('logout')) return;
      const b = document.createElement('button');
      b.id = 'logout'; b.className = 'sm'; b.textContent = 'Выйти · ' + (s.user.email || '');
      b.onclick = async () => { await sb.auth.signOut(); location.reload(); };
      const pw = document.createElement('button');
      pw.className = 'sm'; pw.textContent = 'Пароль';
      pw.onclick = () => {
        if (document.getElementById('pwbox')) return;
        const box = document.createElement('div'); box.id = 'login'; box.setAttribute('data-pw', '1');
        box.innerHTML = `<div class="lbox" id="pwbox"><h2>Пароль для входа</h2><p class="sub">Задайте пароль, чтобы входить без писем — в том числе в приложении на телефоне.</p>
          <form id="pwf"><input type="password" id="pwn" required minlength="6" placeholder="Новый пароль (не меньше 6 символов)" autocomplete="new-password"><button class="pri">Сохранить</button><button type="button" id="pwc">Отмена</button></form><p class="sub" id="pwm"></p></div>`;
        document.body.appendChild(box);
        document.getElementById('pwc').onclick = () => box.remove();
        document.getElementById('pwf').addEventListener('submit', async (e) => {
          e.preventDefault();
          const { error } = await sb.auth.updateUser({ password: document.getElementById('pwn').value });
          document.getElementById('pwm').textContent = error ? 'Не получилось: ' + error.message : 'Пароль сохранён. Теперь входите по почте и паролю.';
          if (!error) setTimeout(() => box.remove(), 1500);
        });
      };
      h.appendChild(pw);
      h.appendChild(b);
    };
    document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', add) : add();
  });

  window.claude = {
    use: async (name) => {
      if (name === 'db') { await allowed; return db; }
      if (name === 'assets') { await allowed; return assets; }
      if (name === 'downloads') return downloads;
      if (name === 'user') return user;
      return null;
    },
  };
})();

// ---------- готовность
function conds(){
  const vot=S.people.filter(p=>VOTE.includes(p.council)),chair=S.people.find(p=>p.council==='chair');
  const cons=vot.filter(p=>rs(p,'consent')==='got'&&rs(p,'coi')==='got');
  const grp=(a,t)=>({have:a.filter(t),wait:a.filter(x=>!t(x))});
  const sci=grp(S.people.filter(p=>isAkk(p)&&SCI.includes(p.degree)),p=>rs(p,'diplom')==='got');
  const mag=grp(S.people.filter(p=>isAkk(p)&&MAG.includes(p.degree)),p=>rs(p,'diplom')==='got'&&(p.degree!=='mba'||rs(p,'nostr')==='got'));
  const ev=k=>grp(S.ev.filter(e=>e.kind===k&&(!e.year||+e.year>=Y-5)),evDone);
  const proj=ev('project'),ip=ev('ip'),trl=ev('trl'),pub=ev('pub');
  const pn=a=>a.map(short),en=a=>a.map(e=>e.title+(authorsOf(e)?' — '+authorsOf(e):''));
  return [
   {g:'Аккредитация',t:'Сотрудники с учёной степенью (КМН, ДМН, PhD) — диплом получен',k:'sci',have:sci.have.length,need:T.sci,names:pn(sci.have),wait:pn(sci.wait),go:'docs'},
   {g:'Аккредитация',t:'Сотрудники со степенью «магистр» — диплом получен',k:'mag',have:mag.have.length,need:T.mag,names:pn(mag.have),wait:pn(mag.wait),go:'docs'},
   {g:'Аккредитация',t:'Научные проекты — документ прикреплён',k:'proj',have:proj.have.length,need:T.proj,names:en(proj.have),wait:en(proj.wait),go:'docs'},
   {g:'Аккредитация',t:'Объекты интеллектуальной собственности',k:'ip',have:ip.have.length,need:T.ip,names:en(ip.have),wait:en(ip.wait),go:'docs'},
   {g:'Аккредитация',t:`Публикации за ${Y-5}–${Y} гг.`,k:'pubs',have:pub.have.length,need:T.pubs,names:[],wait:[],txt:pub.wait.length?`ещё в работе: ${pub.wait.length}`:'',go:'docs'},
   {g:'Аккредитация',t:'Техдокументация по уровню TRL',k:'trl',have:trl.have.length,need:T.trl,names:en(trl.have),wait:en(trl.wait),go:'docs'},
   {g:'Аккредитация',t:'Устав и старое свидетельство об аккредитации',have:(taskDone('a03')?1:0)+(taskDone('a01')?1:0),need:2,names:[taskDone('a03')&&'устав',taskDone('a01')&&'свидетельство'].filter(Boolean),wait:[!taskDone('a03')&&'устав',!taskDone('a01')&&'старое свидетельство'].filter(Boolean),go:'plan'},
   {g:'Учёный совет',t:'Нечётное число голосующих членов',ok:vot.length>0&&vot.length%2===1,txt:`${vot.length} с правом голоса`+(vot.length%2?'':' — нужно нечётное'),go:'sovet'},
   {g:'Учёный совет',t:'Председатель назначен',ok:!!chair,txt:chair?fio(chair):'не назначен',go:'sovet'},
   {g:'Учёный совет',t:'Формы 1 и 2 подписаны всеми членами',have:cons.length,need:vot.length,ok:vot.length>0&&cons.length===vot.length,names:pn(cons),wait:pn(vot.filter(p=>!cons.includes(p))),go:'sovet'},
   {g:'Учёный совет',t:'Приказ и Положение подписаны',ok:taskDone('s04'),txt:taskDone('s04')?'подписано':'проект есть, ждёт подписания',go:'plan'}
  ].map(c=>({...c,ok:c.ok??(c.have>=c.need)}));
}
const V={};
V.gotovnost=()=>{const C=conds(),ok=C.filter(c=>c.ok).length;
  const tags=(a,cls)=>a.slice(0,6).map(n=>`<span class="tag ${cls}">${esc(n)}</span>`).join('')+(a.length>6?`<span class="tag">+${a.length-6}</span>`:'');
  const card=c=>{const has=c.need!=null&&c.have!=null,miss=has?Math.max(c.need-c.have,0):0;return `<div class="cond ${c.ok?'ok':''}" data-go="${c.go}"><div class="ic">${c.ok?'✓':miss||'!'}</div>
   <div><div class="ct">${esc(c.t)}</div>${c.txt?`<div class="sub">${esc(c.txt)}</div>`:''}${(c.names||[]).length?`<div class="tl">${tags(c.names,'ok')}</div>`:''}${(c.wait||[]).length?`<div class="tl"><span class="sub">ждём:</span> ${tags(c.wait,'')}</div>`:''}</div>
   <div class="cnt">${has?`${c.have}<small> / ${c.k&&canW?`<input class="tg" type="number" min="0" max="99" value="${c.need}" data-tg="${c.k}" aria-label="Сколько нужно" title="Сколько нужно">`:c.need}</small>`:''}${c.k&&T[c.k]!==RULE[c.k]?`<div class="sub">по Правилам ${RULE[c.k]}</div>`:''}</div></div>`};
  return `<div class="hero"><div><div class="big">${ok}<small> из ${C.length}</small></div><div class="sub">условий выполнено</div></div><div class="segbar">${C.map(c=>`<i class="${c.ok?'on':''}"></i>`).join('')}</div></div>
  ${['Аккредитация','Учёный совет'].map(g=>`<section class="sec"><h2>${g}</h2><div class="conds">${C.filter(c=>c.g===g).sort((a,b)=>a.ok-b.ok).map(card).join('')}</div></section>`).join('')}
  <p class="sub">Условие отмечается, когда документ «получен» или файл прикреплён. Сколько нужно — можно поменять в поле справа.</p>`};

// ---------- документация для аккредитации
V.docs=()=>{const L=S.people.filter(p=>filter==='debt'?(d=>d.got<d.L.length)(docStat(p)):true);
  return `<div class="between"><div class="row"><button class="chip ${filter==='all'?'on':''}" data-filter="all">Все</button><button class="chip ${filter==='debt'?'on':''}" data-filter="debt">Есть долги</button></div><div class="row">${dl?'<button class="pri" data-missall>Скачать список недостающего</button>':''}${canW?'<button data-add="person">+ Человек</button>':''}</div></div>
  <table class="t stack"><thead><tr><th>ФИО</th><th>Роль</th><th>Документы</th><th>Проекты · ИС · публикации</th></tr></thead><tbody>${L.map(p=>{const d=docStat(p),E=evOf(p),c=k=>E.filter(e=>e.kind===k).length;return `<tr class="click" data-go="p-${esc(p.id)}"><td><b>${esc(fio(p))}</b><div class="sub">${esc([DEG[p.degree]!==DEG.none?DEG[p.degree]:'',p.position].filter(Boolean).join(' · '))}</div></td><td>${p.council&&p.council!=='none'?`<span class="tag">${esc(ROLE[p.council])}</span>`:''}</td><td style="min-width:120px">${d.L.length?bar(d.got,d.L.length)+`<div class="sub">${d.got} из ${d.L.length}</div>`:'<span class="sub">—</span>'}</td><td class="sub">${c('project')} · ${c('ip')} · ${c('pub')}</td></tr>`}).join('')}</tbody></table>`};

V.person=id=>{const p=P(id);if(!p)return '<a class="back" href="#docs">← Все</a><p>Не найдено.</p>';
  const d=docStat(p),E=evOf(p),council=VOTE.includes(p.council);
  const an=[['Место работы, должность',[p.workplace,p.position].filter(Boolean).join(', ')],['Образование',p.edu],['Учёная степень',[DEG[p.degree]!==DEG.none?DEG[p.degree]:'',p.spec,p.dyear].filter(Boolean).join(', ')],['Учёное звание',p.title],['Стаж',p.stazh],['Компетенции',p.comp],['Хирш / Scopus / ORCID',[p.h&&('h = '+p.h),p.ids].filter(Boolean).join(' · ')],['Основание выдвижения',p.osnov],['Контакты',[p.phone,p.email].filter(Boolean).join(' · ')],['Работа в центре',[STAFF[p.staff],p.hire&&('с '+dmy(p.hire))].filter(Boolean).join(', ')]];
  const docRow=r=>{const q=p.req?.[r.k]||{},st=q.st||'none';return `<div class="doc"><span class="dot ${st}"></span><div><div class="ttl">${esc(r.t)}</div><div class="sub">${esc(r.src)}${q.date&&st!=='none'?' · '+(st==='got'?'получено ':'запрошено ')+dmy(q.date):''}</div></div>
   <div class="seg" role="group">${Object.keys(RST).map(k=>`<button class="${k} ${st===k?'on':''}" data-rq="${r.k}" data-v="${k}"${canW?'':' disabled'}>${RST[k]}</button>`).join('')}</div>
   <div class="acts2 files">${r.form&&dl?`<button class="link" data-form="${r.form}">Скачать бланк</button>`:''}${(q.files||[]).map((f,i)=>`<a href="#" data-file="${esc(f.id)}">${esc(f.name||'файл')}</a>${canW&&assets?`<button class="link" data-rmf="${r.k}" data-i="${i}" aria-label="Открепить">убрать</button>`:''}`).join('')}${canW&&assets?`<label class="up">+ прикрепить скан<input type="file" data-upk="${r.k}" accept=".pdf,image/*" multiple hidden></label>`:''}</div></div>`};
  const evBlock=(k,lbl,add)=>{const L=E.filter(e=>e.kind===k);return `<div style="margin-bottom:18px"><div class="between" style="margin-bottom:4px"><h3 style="margin:0">${lbl}</h3>${canW?`<button class="sm" data-addev="${k}">+ ${add}</button>`:''}</div>${L.length?L.map(e=>{const s=e.steps||[],dn=s.filter(x=>x.done).length;return `<div class="item" data-e="${esc(e.id)}"><div><div>${esc(e.title)}</div><div class="sub">${esc([k==='pub'?(CAT[e.cat]||'').split(' (')[0]:'',e.year,s.length?`${dn}/${s.length} шагов`:'',e.files?.length?'файлов: '+e.files.length:''].filter(Boolean).join(' · '))}</div></div><span class="tag ${evDone(e)?'ok':'wait'}">${evDone(e)?'есть':'в работе'}</span></div>`}).join(''):'<p class="sub" style="margin:4px 0">Пока нет.</p>'}</div>`};
  return `<a class="back" href="#docs">← Документация для аккредитации</a>
  <div class="ph"><div><h1>${esc(fio(p))}</h1><div class="row" style="margin-top:8px">${p.council&&p.council!=='none'?`<span class="tag dark">${esc(ROLE[p.council])}</span>`:''}${DEG[p.degree]!==DEG.none?`<span class="tag">${esc(DEG[p.degree])}</span>`:''}${p.position?`<span class="tag">${esc(p.position)}</span>`:''}</div></div>
  <div class="row">${canW?`<button data-edit="${esc(p.id)}">Изменить анкету</button>`:''}${dl&&(d.got<d.L.length||(council&&missingOf(p).ank.length))?`<button data-missone="${esc(p.id)}">Что не хватает</button>`:''}${council&&dl?`<button class="pri" data-savesign="${esc(p.id)}">Скачать формы 1–3</button>`:''}</div></div>
  <div class="cols"><div>
   <section class="sec"><h2>Документы · ${d.got} из ${d.L.length}</h2>${d.L.length?d.L.map(docRow).join(''):'<p class="sub">Документы не требуются. Чтобы включить человека в аккредитацию — укажите степень в анкете; в совет — роль.</p>'}</section>
   <section class="sec"><h2>Проекты, ИС и публикации</h2>${evBlock('project','Научные проекты','Проект')}${evBlock('ip','Интеллектуальная собственность','ОИС')}${evBlock('pub','Публикации','Публикация')}${E.some(e=>e.kind==='trl')?evBlock('trl','Техдокументация TRL','TRL'):''}</section>
  </div>
  <aside class="card"><div class="between" style="margin-bottom:10px"><h3 style="margin:0">Анкета</h3>${canW?`<button class="link" data-edit="${esc(p.id)}">заполнить</button>`:''}</div>
   <dl class="dl">${an.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${b?esc(b):'<span class="sub">—</span>'}</dd>`).join('')}</dl>${p.note?`<p class="sub" style="margin-bottom:0">${esc(p.note)}</p>`:''}
   ${council?'<p class="sub" style="margin-bottom:0">Анкета подставляется в форму 3 (карточку кандидата).</p>':''}</aside></div>`};

// ---------- учёный совет
V.sovet=()=>{const vot=S.people.filter(p=>VOTE.includes(p.council)),all=S.people.filter(p=>p.council&&p.council!=='none');
  const ic=(p,k)=>{const s=rs(p,k);return `<span class="tag ${s==='got'?'ok':s==='asked'?'wait':''}">${s==='got'?'✓ есть':s==='asked'?'ждём':'нет'}</span>`};
  return `<div class="note">По проекту приказа: 11 членов с правом голоса — председатель, заместитель, 8 специалистов и внешний эксперт; срок 2 года; секретарь избирается на первом заседании и не голосует; заседания не реже раза в квартал; кворум — 2/3. Приказ подписывается, когда собраны формы всех членов.</div>
  <div class="between"><h2 style="margin:0">Состав · ${vot.length} с правом голоса · кворум ${Math.ceil(vot.length*2/3)}</h2>${dl?'<button class="pri" data-signall>Скачать формы 1–3 для всех</button>':''}</div>
  <table class="t stack"><thead><tr><th>ФИО</th><th>Роль</th><th>Форма 1</th><th>Форма 2</th><th>Форма 3</th></tr></thead><tbody>${all.map(p=>`<tr class="click" data-go="p-${esc(p.id)}"><td><b>${esc(fio(p))}</b>${p.staff==='external'?' <span class="tag">внешний</span>':''}</td><td>${esc(ROLE[p.council])}</td>${VOTE.includes(p.council)?['consent','coi','anketa'].map(k=>`<td>${ic(p,k)}</td>`).join(''):'<td></td><td></td><td></td>'}</tr>`).join('')}</tbody></table>
  <h2 style="margin-top:32px">Шаги по созданию совета</h2>${S.tasks.filter(t=>t.track==='sovet').sort((a,b)=>(a.n||0)-(b.n||0)).map(taskRow).join('')}`};

// ---------- заседания
const MST={plan:'Запланировано',held:'Проведено',appr:'Протокол на согласовании',signed:'Протокол подписан'};
const AST={none:'Не отправлено',sent:'Отправлено',ok:'Согласовано',rem:'Замечания'};
const invitees=()=>S.people.filter(p=>VOTE.includes(p.council)||p.council==='secretary');
const voters=()=>S.people.filter(p=>VOTE.includes(p.council));
const agendaTxt=m=>(m.agenda||[]).map((a,i)=>`${i+1}. ${a.t}${a.speaker?' (докл. '+a.speaker+')':''}`).join('\n')||'—';
const when=m=>[dmy(m.date),m.time].filter(Boolean).join(', ');
const sig=()=>SND.name?'\n\nС уважением,\n'+SND.name:'';
const inviteText=m=>`Уважаемые члены Учёного совета!\n\nПриглашаем на заседание Учёного совета ТОО «Центр гематологии»${m.n?' № '+m.n:''}.\nДата и время: ${when(m)||'—'} (Астана)\nФормат: онлайн, Zoom${m.zoom?': '+m.zoom:''}\n\nПовестка:\n${agendaTxt(m)}\n\nПросим подтвердить участие.`+sig();
const apprText=m=>`Уважаемые члены Учёного совета!\n\nНаправляю на согласование проект протокола${m.n?' № '+m.n:''} заседания Учёного совета от ${dmy(m.date)||'—'}.\n\nРешения:\n${(m.agenda||[]).map((a,i)=>`${i+1}. ${a.decided||'(решение не внесено)'}`).join('\n')||'—'}\n\nПрошу ответить «Согласовано» или прислать замечания.`+sig();
function mStat(m){const inv=invitees(),vo=voters(),pres=vo.filter(p=>m.present?.[p.id]).length,q=Math.ceil(vo.length*2/3);return {inv,vo,invited:inv.filter(p=>m.invited?.[p.id]).length,pres,q,quorum:pres>=q&&vo.length>0,ok:vo.filter(p=>m.appr?.[p.id]?.st==='ok').length}}
V.zasedaniya=()=>{const L=[...S.meet].sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
  return `<div class="between"><p class="sub" style="margin:0">Подготовка → приглашения → проведение → протокол → согласование.</p>${canW?'<button class="pri" data-addmeet>+ Заседание</button>':''}</div>
  ${L.length?`<div class="conds">${L.map(m=>{const s=mStat(m);return `<div class="cond ${m.status==='signed'?'ok':''}" data-go="m-${esc(m.id)}"><div class="ic">${m.status==='signed'?'✓':esc(m.n||'•')}</div><div><div class="ct">Заседание${m.n?' № '+esc(m.n):''} · ${esc(when(m)||'дата не назначена')}</div><div class="sub">${esc(MST[m.status||'plan'])} · приглашено ${s.invited}/${s.inv.length}${m.status&&m.status!=='plan'?` · были ${s.pres}/${s.vo.length} · согласовали ${s.ok}/${s.vo.length}`:''}</div><div class="sub">${esc((m.agenda||[]).map(a=>a.t).slice(0,3).join(' · '))}</div></div><div></div></div>`}).join('')}</div>`:'<p class="note">Заседаний пока нет. По проекту приказа первое проводится в течение 30 дней после утверждения состава: избрание секретаря, план заседаний, приоритеты на 2027 год.</p>'}`};
V.meeting=id=>{const m=S.meet.find(x=>x.id===id);if(!m)return '<a class="back" href="#zasedaniya">← Заседания</a><p>Не найдено.</p>';
  const s=mStat(m),chair=S.people.find(p=>p.council==='chair'),sec=S.people.find(p=>p.council==='secretary');
  const step=(n,t,body,done)=>`<section class="mstep ${done?'done':''}"><div class="mn">${done?'✓':n}</div><div><h3>${t}</h3>${body}</div></section>`;
  const row=(p,right)=>`<div class="prow"><div><b>${esc(fio(p))}</b><div class="sub">${esc(ROLE[p.council])}</div></div><div class="row">${right}</div></div>`;
  return `<a class="back" href="#zasedaniya">← Заседания</a>
  <div class="ph"><div><h1>Заседание${m.n?' № '+esc(m.n):''}</h1><div class="row" style="margin-top:8px"><span class="tag dark">${esc(MST[m.status||'plan'])}</span><span class="tag">${esc(when(m)||'дата не назначена')}</span>${m.zoom&&/^https:\/\//.test(m.zoom)?`<a class="tag" href="${esc(m.zoom)}" target="_blank" rel="noopener">открыть Zoom</a>`:''}</div></div>
  <div class="row">${canW?`<select data-mstatus="${esc(m.id)}" aria-label="Статус">${opt(MST,m.status||'plan')}</select><button data-editmeet="${esc(m.id)}">Изменить</button>`:''}</div></div>
  ${step(1,'Подготовка',`<dl class="dl"><dt>Дата и время</dt><dd>${esc(when(m)||'—')}</dd><dt>Ссылка Zoom</dt><dd style="overflow-wrap:anywhere">${esc(m.zoom||'—')}</dd><dt>Повестка</dt><dd style="white-space:pre-line">${esc(agendaTxt(m))}</dd></dl>`,m.date&&m.zoom&&(m.agenda||[]).length)}
  ${step(2,'Приглашения · '+s.invited+' из '+s.inv.length,`<div class="row" style="margin-bottom:8px"><button class="pri" data-copytxt="inv">Скопировать приглашение</button>${canW?'<button data-markall="invited">Отметить: приглашены все</button>':''}</div><p class="sub">Вставьте текст в общий чат или письмо, затем отметьте, кто приглашён.</p>
   ${s.inv.map(p=>row(p,`<label class="row" style="gap:6px"><input type="checkbox" data-inv="${esc(p.id)}"${m.invited?.[p.id]?' checked':''}${canW?'':' disabled'}> приглашён</label>`)).join('')}`,s.inv.length&&s.invited===s.inv.length)}
  ${step(3,'Проведение · присутствуют '+s.pres+' из '+s.vo.length,`<p style="margin:0 0 6px">${s.vo.length?(s.quorum?'<span class="tag ok">кворум есть</span>':'<span class="tag wait">кворума нет</span>')+` <span class="sub">нужно не менее ${s.q}</span>`:''}</p>
   ${s.vo.map(p=>row(p,`<label class="row" style="gap:6px"><input type="checkbox" data-present="${esc(p.id)}"${m.present?.[p.id]?' checked':''}${canW?'':' disabled'}> присутствует</label>`)).join('')}
   <h3 style="margin-top:16px">Решения по вопросам</h3>${(m.agenda||[]).map((a,i)=>`<div class="item" data-agenda="${i}"><div><b>${i+1}. ${esc(a.t)}</b><div class="sub">${a.decided?'Решили: '+esc(a.decided)+` · за ${esc(a.za??s.pres)}, против ${esc(a.protiv||0)}, возд. ${esc(a.vozd||0)}`:'нажмите, чтобы внести решение'}</div></div><span class="tag ${a.decided?'ok':''}">${a.decided?'✓':'внести'}</span></div>`).join('')||'<p class="sub">Сначала добавьте повестку.</p>'}`,s.pres&&(m.agenda||[]).length&&(m.agenda||[]).every(a=>a.decided))}
  ${step(4,'Протокол',`<p class="sub" style="margin-top:0">Собирается автоматически. Председательствующий — ${esc(chair?short(chair):'—')}, секретарь — ${esc(dot(sec?short(sec):'—'))}</p>
   <div class="row"><button class="pri" data-proto="${esc(m.id)}">Открыть протокол</button></div>
   <div class="row files" style="margin-top:10px">${(m.files||[]).map((f,i)=>`<a href="#" data-file="${esc(f.id)}">${esc(f.name||'файл')}</a>${canW&&assets?`<button class="link" data-mrmf="${i}">убрать</button>`:''}`).join('')}${canW&&assets?`<label class="up">+ прикрепить подписанный протокол<input type="file" data-mup accept=".pdf,image/*" multiple hidden></label>`:''}</div>`,(m.files||[]).length)}
  ${step(5,'Согласование протокола · '+s.ok+' из '+s.vo.length,`<div class="row" style="margin-bottom:8px"><button class="pri" data-copytxt="appr">Скопировать текст на согласование</button></div>
   ${s.vo.map(p=>{const a=m.appr?.[p.id]||{};return row(p,`<div class="seg">${Object.keys(AST).map(k=>`<button class="${k==='ok'?'got':k==='none'?'none':'asked'} ${(a.st||'none')===k?'on':''}" data-appr="${esc(p.id)}" data-v="${k}"${canW?'':' disabled'}>${AST[k]}</button>`).join('')}</div>`)+(a.st==='rem'?`<div style="margin:-4px 0 10px"><input data-rem="${esc(p.id)}" value="${esc(a.comment)}" placeholder="замечания" style="min-height:34px;width:min(100%,460px)"></div>`:'')}).join('')}`,s.vo.length&&s.ok===s.vo.length)}`};
function protoHtml(m){const s=mStat(m),chair=S.people.find(p=>p.council==='chair'),sec=S.people.find(p=>p.council==='secretary');const pres=s.vo.filter(p=>m.present?.[p.id]),abs=s.vo.filter(p=>!m.present?.[p.id]);
  return `<h3>ПРОТОКОЛ${m.n?' № '+esc(m.n):''}<br>заседания Учёного совета ТОО «Центр гематологии»</h3><p>г. Астана&nbsp;&nbsp;&nbsp;&nbsp;${esc(dmy(m.date)||'«___» ________ '+Y+' г.')}${m.time?', '+esc(m.time):''}<br>Форма проведения: онлайн (Zoom)</p>
  <p>Председательствующий: ${esc(chair?fio(chair):'________________')}<br>Секретарь: ${esc(sec?fio(sec):'________________')}</p>
  <p>Присутствовали: ${pres.length} из ${s.vo.length} членов Совета — ${esc(dot(pres.map(short).join(', ')||'—'))}<br>Отсутствовали: ${esc(dot(abs.map(short).join(', ')||'нет'))}<br>Кворум ${s.quorum?'имеется':'отсутствует'} (не менее 2/3 состава — ${s.q}).</p>
  <p><b>Повестка дня:</b><br>${(m.agenda||[]).map((a,i)=>`${i+1}. ${esc(a.t)}`).join('<br>')||'—'}</p>
  ${(m.agenda||[]).map((a,i)=>`<p><b>${i+1}. По вопросу «${esc(a.t)}»</b><br>СЛУШАЛИ: ${esc([a.speaker,a.heard].filter(Boolean).join(' — ')||'________________')}<br>РЕШИЛИ: ${esc(a.decided||'________________')}<br>Голосовали: «за» — ${esc(a.za??pres.length)}, «против» — ${esc(a.protiv||0)}, «воздержались» — ${esc(a.vozd||0)}.</p>`).join('')}
  <p style="margin-top:28px">Председательствующий ____________________ / ${esc(chair?short(chair):'')} /<br><br>Секретарь ____________________ / ${esc(sec?short(sec):'')} /</p>`}

// ---------- план работ
function taskRow(t){const s=t.steps||[];return `<div class="task ${t.status==='done'?'done':''}"><span class="st ${esc(t.status)}"></span><div><div class="tt" data-t="${esc(t.id)}" style="cursor:pointer">${esc(t.title)}</div><div class="sub">${esc([t.owner,t.due?'до '+dmy(t.due):'',s.length?`${s.filter(x=>x.done).length}/${s.length} шагов`:'',t.files?.length?'файлов: '+t.files.length:''].filter(Boolean).join(' · '))}</div></div>${canW?`<select data-ts="${esc(t.id)}" aria-label="Статус">${opt(TST,t.status)}</select>`:`<span class="tag">${TST[t.status]||''}</span>`}</div>`}
V.plan=()=>`<div class="between"><p class="sub" style="margin:0">Статус меняется в строке; по названию открывается задача с шагами и файлами.</p>${canW?'<button data-add="task">+ Задача</button>':''}</div>
  <div class="cols">${[['akk','Аккредитация'],['sovet','Учёный совет']].map(([k,l])=>`<section><h2>${l}</h2>${S.tasks.filter(t=>t.track===k).sort((a,b)=>(a.n||0)-(b.n||0)).map(taskRow).join('')}</section>`).join('')}</div>`;

// ---------- маршрут
function route(){const h=(location.hash||'#gotovnost').slice(1);if(h.startsWith('p-'))return ['docs',h.slice(2),'p'];if(h.startsWith('m-'))return ['zasedaniya',h.slice(2),'m'];return [['gotovnost','docs','sovet','zasedaniya','plan'].includes(h)?h:'gotovnost']}
function render(){const [k,id,t]=route();document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.hash==='#'+k));$('#view').innerHTML=id?(t==='m'?V.meeting(id):V.person(id)):V[k]();}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

// ---------- формы и документы на подпись
const ln=(v,n=60)=>v?`<u>&nbsp;${esc(v)}&nbsp;</u>`:'_'.repeat(n);
const PB='<br clear="all" style="page-break-before:always">';
const SIGN=p=>`<p style="margin-top:28px">Дата: ___________&nbsp;&nbsp;&nbsp;&nbsp;Подпись: ___________&nbsp;&nbsp;&nbsp;&nbsp;${esc(short(p))}</p>`;
const pos=p=>[p.position,p.workplace].filter(Boolean).join(', ');
const FORMS={
1:p=>`<p style="text-align:right">Генеральному директору<br>ТОО «Центр гематологии»<br>от ${ln(fio(p),40)}</p><p>Должность, организация: ${ln(pos(p),50)}<br>Контакт для служебной коммуникации: ${ln([p.phone,p.email].filter(Boolean).join(', '),40)}</p><h3>СОГЛАСИЕ</h3>
<p style="text-align:justify">Настоящим подтверждаю согласие на включение моей кандидатуры в состав Учёного совета ТОО «Центр гематологии» сроком на два года после утверждения соответствующим приказом. С Положением об Учёном совете ознакомлен(а), обязуюсь соблюдать требования научной добросовестности, конфиденциальности (в том числе не разглашать сведения, составляющие тайну медицинского работника, и персональные данные пациентов) и заявлять о конфликте интересов до участия в рассмотрении соответствующих вопросов.</p>
<p style="text-align:justify">Мне известно, что решения Совета носят рекомендательный характер, а участие в работе Совета не является само по себе трудовым договором с Центром.</p>
<p style="text-align:justify">В соответствии с Законом РК от 21 мая 2013 года № 94-V «О персональных данных и их защите» даю согласие ТОО «Центр гематологии» на сбор и обработку моих персональных данных (Ф.И.О., сведения об образовании, учёной степени, месте работы, должности, контактные данные), указанных в настоящем согласии и карточке кандидата, в целях формирования и обеспечения деятельности Учёного совета, включая их указание в приказе о составе Совета, на срок полномочий Совета и срок хранения документов. Согласие может быть отозвано письменным заявлением, за исключением случаев, предусмотренных законом.</p>
<p>Дополнительные условия участия внешнего эксперта (при наличии): ${'_'.repeat(30)}</p>${SIGN(p)}`,
2:p=>`<h3>ДЕКЛАРАЦИЯ<br>о конфликте интересов</h3><p>Ф.И.О.: ${ln(fio(p),50)}<br>Должность и организация: ${ln(pos(p),45)}</p>
<p style="text-align:justify">Подтверждаю, что ознакомлен(а) с обязанностью заявлять о личной, профессиональной и финансовой заинтересованности при обсуждении научных проектов и решений Совета.</p>
<p>Наличие обстоятельств, способных создать конфликт интересов (отметить):<br>☐ Не выявлено на дату заполнения.<br>☐ Имеются; описание: ${'_'.repeat(45)}<br>${'_'.repeat(70)}</p>
<p style="text-align:justify">Обязуюсь обновлять настоящую декларацию при возникновении новых обстоятельств и не участвовать в голосовании по затрагивающим меня вопросам.</p>${SIGN(p)}`,
3:p=>{const pp=evOf(p).map(e=>`${e.title}${e.year?' ('+e.year+')':''}`).join('; ');const rows=[['Ф.И.О. полностью',fio(p)],['Основное место работы и должность',[p.workplace,p.position].filter(Boolean).join(', ')],['Профиль высшего образования',p.edu],['Учёная степень / звание (если есть)',[SCI.includes(p.degree)||MAG.includes(p.degree)||p.degree==='md'?DEG[p.degree]:'',p.spec,p.dyear,p.title].filter(Boolean).join(', ')],['Научный / профессиональный стаж (при наличии)',p.stazh],['Ключевые компетенции для Совета',p.comp],['Публикации и проекты (при наличии)',[p.h&&('индекс Хирша '+p.h),pp].filter(Boolean).join('; ')],['Основание выдвижения / согласования',p.osnov]];
  return `<h3>КАРТОЧКА КАНДИДАТА<br>в состав Учёного совета ТОО «Центр гематологии»</h3><table style="border-collapse:collapse;width:100%">${rows.map(([a,b])=>`<tr><td style="border:1px solid #000;padding:6px;width:38%;vertical-align:top">${esc(a)}</td><td style="border:1px solid #000;padding:6px;vertical-align:top">${b?esc(b):'&nbsp;'}</td></tr>`).join('')}</table>${SIGN(p)}`}};
const signPack=p=>[1,2,3].map(n=>FORMS[n](p)).join(PB);
const wordDoc=body=>`<html><head><meta charset="utf-8"><style>@page{size:A4;margin:2cm 1.5cm 2cm 2.5cm}body{font:12pt "Times New Roman";line-height:1.35}h3{text-align:center;font-size:13pt}p{margin:0 0 8pt}</style></head><body>${body}</body></html>`;
async function saveDoc(name,body){if(!dl)return toast('Скачивание недоступно');try{await dl.save({filename:name,data:new Blob(['﻿'+wordDoc(body)],{type:'application/msword'})});toast('Файл сохранён')}catch(e){toast('Скачивание отменено')}}

// ---------- список недостающего
const ANK=[['position','должность'],['edu','образование (вуз, год, специальность)'],['stazh','научный / профессиональный стаж'],['comp','ключевые компетенции для Совета'],['h','индекс Хирша'],['ids','Scopus ID / ORCID'],['phone','контактный телефон']];
function missingOf(p){const docs=reqs(p).filter(r=>rs(p,r.k)!=='got');const ank=VOTE.includes(p.council)?ANK.filter(([k])=>!p[k]).map(a=>a[1]):[];return {docs,ank}}
function missingBlock(p,n){const {docs,ank}=missingOf(p);if(!docs.length&&!ank.length)return '';
  return `<p style="margin-top:14pt"><b>${n?n+'. ':''}${esc(fio(p))}</b>${p.council&&p.council!=='none'?' — '+esc(ROLE[p.council]):''}</p>${docs.length?`<p>Документы:</p><ol>${docs.map(r=>`<li>${esc(r.t)}${r.form?' (бланк прилагается)':''}</li>`).join('')}</ol>`:''}${ank.length?`<p>Сведения для карточки кандидата: ${esc(ank.join(', '))}.</p>`:''}`}
const missHead=t=>`<h3>${t}</h3><p style="text-align:center">ТОО «Центр гематологии» · по состоянию на ${dmy(today())}</p>`;
const missFoot=()=>`<p style="margin-top:18pt">Сканы документов (PDF или фото) просьба направить секретарю Учёного совета.${SND.name?'<br>Контактное лицо: '+esc(SND.name):''}</p>`;
function missingAll(){let n=0;const body=S.people.map(p=>{const b=missingBlock(p,n+1);if(b)n++;return b}).join('');return n?missHead('Перечень недостающих документов<br>для аккредитации по науке и Учёного совета')+body+missFoot():''}
function missingText(p){const {docs,ank}=missingOf(p);return `${fio(p)}\n\nДля аккредитации по науке и Учёного совета ТОО «Центр гематологии» прошу прислать:\n${docs.map((r,i)=>`${i+1}. ${r.t}`).join('\n')}${ank.length?`\n\nДля карточки кандидата также нужны: ${ank.join(', ')}.`:''}\n\nСканы можно в PDF или фото.${SND.name?'\n'+SND.name:''}`}

// ---------- диалоги
let F={steps:[],files:[]};
const opt=(o,v)=>Object.keys(o).map(k=>`<option value="${k}"${v===k?' selected':''}>${esc(o[k])}</option>`).join('');
function open(html){$('#dlg').innerHTML=html;$('#ov').classList.add('on')}
function close(){$('#ov').classList.remove('on');render()}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))close()});
const acts=(col,id)=>`<div class="acts">${id&&canW?`<button type="button" class="del" data-del="${col}">Удалить</button>`:''}<button type="button" data-close>Закрыть</button>${canW?'<button class="pri">Сохранить</button>':''}</div>`;
function personForm(p){p=p||{};const ro=canW?'':' disabled';
  open(`<h2>${p.id?esc(fio(p)):'Новый человек'}</h2><form id="fm" data-kind="person" data-id="${esc(p.id||'')}"><fieldset style="border:0;padding:0;margin:0"${ro}><div class="f">
  <h4>ФИО и роль</h4><label>Фамилия<input name="fam" value="${esc(p.fam)}" required></label><label>Имя<input name="im" value="${esc(p.im)}"></label><label>Отчество<input name="ot" value="${esc(p.ot)}"></label>
  <label>Роль в совете<select name="council">${opt(ROLE,p.council||'none')}</select></label><label>Работа в центре<select name="staff">${opt(STAFF,p.staff||'unk')}</select></label><label>Дата приёма<input type="date" name="hire" value="${esc(p.hire)}"></label>
  <label class="cb w"><input type="checkbox" name="akk"${p.akk===false?'':' checked'}>Учитывать в аккредитации (если есть степень и это не внешний)</label>
  <h4>Анкета — идёт в форму 3</h4><label>Основное место работы<input name="workplace" value="${esc(p.workplace??'ТОО «Центр гематологии»')}"></label><label>Должность<input name="position" value="${esc(p.position)}"></label>
  <label class="w">Образование (вуз, год, специальность)<textarea name="edu">${esc(p.edu)}</textarea></label>
  <label>Степень<select name="degree">${opt(DEG,p.degree||'none')}</select></label><label>Специальность степени<input name="spec" value="${esc(p.spec)}"></label><label>Год присуждения<input name="dyear" inputmode="numeric" value="${esc(p.dyear)}"></label>
  <label>Учёное звание<input name="title" value="${esc(p.title)}"></label><label>Научный / проф. стаж<input name="stazh" value="${esc(p.stazh)}"></label>
  <label>Индекс Хирша<input name="h" inputmode="numeric" value="${esc(p.h)}"></label><label>Scopus ID / ORCID<input name="ids" value="${esc(p.ids)}"></label>
  <label class="w">Ключевые компетенции для Совета<textarea name="comp">${esc(p.comp)}</textarea></label>
  <label class="w">Основание выдвижения / согласования<input name="osnov" value="${esc(p.osnov)}"></label>
  <label>Телефон<input name="phone" type="tel" value="${esc(p.phone)}"></label><label>E-mail<input name="email" type="email" value="${esc(p.email)}"></label>
  <label class="w">Заметка<textarea name="note">${esc(p.note)}</textarea></label></div></fieldset>${acts('people',p.id)}</form>`)}
function stepsHtml(){return F.steps.map((s,i)=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" data-step="${i}"${s.done?' checked':''}${canW?'':' disabled'}><span style="flex:1;${s.done?'text-decoration:line-through;color:var(--mute)':''}">${esc(s.t)}</span>${canW?`<button type="button" class="link" data-rmstep="${i}">убрать</button>`:''}</label>`).join('')||'<p class="sub" style="margin:0">Шагов пока нет.</p>'}
function filesHtml(){return F.files.map((f,i)=>`<span class="row" style="gap:4px"><a href="#" data-file="${esc(f.id)}">${esc(f.name||'файл')}</a>${canW&&assets?`<button type="button" class="link" data-rmfile="${i}">убрать</button>`:''}</span>`).join(' ')||'<span class="sub">Файлов нет.</span>'}
function extras(x){F.steps=JSON.parse(JSON.stringify(x.steps||[]));F.files=JSON.parse(JSON.stringify(x.files||[]));
  return `<h4 style="margin:12px 0 6px;font-size:13px">Что нужно сделать</h4><div id="steps" style="display:grid;gap:6px">${stepsHtml()}</div>${canW?'<div class="row" style="margin-top:8px"><input id="newstep" placeholder="Новый шаг" style="flex:1"><button type="button" data-addstep>Добавить</button></div>':''}
  <h4 style="margin:16px 0 6px;font-size:13px">Файлы</h4><div id="files" class="row files">${filesHtml()}</div>${canW&&assets?'<label class="up" style="display:inline-block;margin-top:6px">+ прикрепить файл<input type="file" id="up" accept=".pdf,image/*" multiple hidden></label> <span class="sub" id="upmsg"></span>':''}`}
function evForm(e){e=e||{kind:'pub',status:'have'};const ro=canW?'':' disabled';
  open(`<h2>${esc(KIND[e.kind]||'Запись')}</h2><form id="fm" data-kind="ev" data-id="${esc(e.id||'')}"><fieldset style="border:0;padding:0;margin:0"${ro}><div class="f">
  <label>Тип<select name="kind">${opt(KIND,e.kind)}</select></label>${e.kind==='pub'?`<label>Категория<select name="cat">${opt(CAT,e.cat||'koks')}</select></label>`:''}
  <label class="w">Название<input name="title" value="${esc(e.title)}" required></label><label class="w">Журнал / заказчик / № документа<input name="source" value="${esc(e.source)}"></label>
  <label>Год<input name="year" inputmode="numeric" value="${esc(e.year??Y)}"></label><label>Статус<select name="status">${opt({have:'Есть, документ на руках',plan:'В работе'},e.status)}</select></label>
  <label>Ответственный<input name="owner" value="${esc(e.owner)}"></label><label>Срок<input type="date" name="due" value="${esc(e.due)}"></label>
  <label class="w">Авторы / исполнители<div class="chips">${S.people.map(p=>`<label><input type="checkbox" name="a" value="${esc(p.id)}"${(e.authors||[]).includes(p.id)?' checked':''}>${esc(short(p))}</label>`).join('')}</div></label>
  <label class="w">Заметки<textarea name="note">${esc(e.note)}</textarea></label></div></fieldset>${extras(e)}${acts('evidence',e.id)}</form>`)}
function taskForm(t){t=t||{track:'akk',status:'todo'};const ro=canW?'':' disabled';
  open(`<h2>${t.id?'Задача':'Новая задача'}</h2><form id="fm" data-kind="task" data-id="${esc(t.id||'')}"><fieldset style="border:0;padding:0;margin:0"${ro}><div class="f">
  <label class="w">Задача<input name="title" value="${esc(t.title)}" required></label>
  <label>Направление<select name="track">${opt({akk:'Аккредитация',sovet:'Учёный совет'},t.track)}</select></label><label>Статус<select name="status">${opt(TST,t.status)}</select></label>
  <label>Ответственный<input name="owner" value="${esc(t.owner)}"></label><label>Срок<input type="date" name="due" value="${esc(t.due)}"></label>
  <label class="w">Комментарий<textarea name="note">${esc(t.note)}</textarea></label></div></fieldset>${extras(t)}${acts('tasks',t.id)}</form>`)}
function meetForm(m){m=m||{agenda:[]};const ag=(m.agenda||[]).map(a=>a.t+(a.speaker?' | '+a.speaker:'')).join('\n');
  open(`<h2>${m.id?'Заседание':'Новое заседание'}</h2><form id="fm" data-kind="meet" data-id="${esc(m.id||'')}"><div class="f">
  <label>Номер<input name="n" value="${esc(m.n??(S.meet.length+1))}"></label><label>Дата<input type="date" name="date" value="${esc(m.date)}"></label><label>Время<input type="time" name="time" value="${esc(m.time)}"></label>
  <label class="w">Ссылка Zoom<input name="zoom" value="${esc(m.zoom)}" placeholder="https://zoom.us/j/…"></label>
  <label class="w">Повестка — каждый вопрос с новой строки, докладчик после «|»<textarea name="agenda" style="min-height:120px" placeholder="Избрание секретаря Учёного совета | Клодзинский А.А.&#10;План заседаний на 2027 год">${esc(ag)}</textarea></label></div>
  <div class="acts">${m.id?'<button type="button" class="del" data-del="meetings">Удалить</button>':''}<button type="button" data-close>Закрыть</button><button class="pri">Сохранить</button></div></form>`)}
function agendaForm(m,i){const a=m.agenda[i],s=mStat(m);
  open(`<h2>Вопрос ${i+1}</h2><p>${esc(a.t)}</p><form id="agf" data-mid="${esc(m.id)}" data-i="${i}"><div class="f">
  <label>Докладчик<input name="speaker" value="${esc(a.speaker)}"></label><label class="w">Слушали<textarea name="heard">${esc(a.heard)}</textarea></label><label class="w">Решили<textarea name="decided">${esc(a.decided)}</textarea></label>
  <label>«За»<input name="za" inputmode="numeric" value="${esc(a.za??s.pres)}"></label><label>«Против»<input name="protiv" inputmode="numeric" value="${esc(a.protiv??0)}"></label><label>«Воздержались»<input name="vozd" inputmode="numeric" value="${esc(a.vozd??0)}"></label></div>
  <div class="acts"><button type="button" data-close>Закрыть</button>${canW?'<button class="pri">Сохранить</button>':''}</div></form>`)}
function protoForm(m){open(`<h2>Протокол${m.n?' № '+esc(m.n):''}</h2><div class="cv">${protoHtml(m)}</div><div class="acts"><button type="button" data-close>Закрыть</button><button type="button" data-copyproto="${esc(m.id)}">Скопировать текст</button>${dl?`<button class="pri" type="button" data-saveproto="${esc(m.id)}">Скачать для Word</button>`:''}</div>`)}
const curM=()=>S.meet.find(x=>x.id===route()[1]);
const mupd=o=>save(()=>db.doc('meetings/'+curM().id).update(o));
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Скопировано')}catch(e){toast('Не удалось скопировать')}}

// ---------- события
document.addEventListener('click',async ev=>{
  const g=s=>ev.target.closest(s);let x;
  if(x=g('[data-close]'))return close();
  if(x=g('[data-filter]')){filter=x.dataset.filter;return render()}
  if(x=g('[data-add]'))return x.dataset.add==='person'?personForm():taskForm();
  if(x=g('[data-addev]'))return evForm({kind:x.dataset.addev,status:x.dataset.addev==='pub'?'have':'plan',authors:[route()[1]],cat:'koks'});
  if(x=g('[data-edit]'))return personForm(P(x.dataset.edit));
  if(x=g('[data-form]')){const p=P(route()[1]),n=+x.dataset.form;return saveDoc(`Форма_${n}_${p.fam||''}.doc`,FORMS[n](p))}
  if(x=g('[data-savesign]')){const p=P(x.dataset.savesign);return saveDoc('Формы_1-3_'+(p.fam||'')+'.doc',signPack(p))}
  if(x=g('[data-signall]'))return saveDoc('Учёный_совет_формы_1-3_все.doc',S.people.filter(p=>VOTE.includes(p.council)).map(signPack).join(PB));
  if(x=g('[data-missall]')){const b=missingAll();if(!b)return toast('Все документы собраны');return saveDoc('Недостающие_документы_'+today()+'.doc',b)}
  if(x=g('[data-missone]')){const p=P(x.dataset.missone);return open(`<h2>Что не хватает · ${esc(short(p))}</h2><pre style="white-space:pre-wrap;background:var(--soft);padding:14px;border-radius:8px;font:14px/1.5 Onest,sans-serif;margin:0" id="misstxt">${esc(missingText(p))}</pre><div class="acts"><button type="button" data-close>Закрыть</button><button type="button" data-copymiss>Скопировать текст</button>${dl?`<button class="pri" type="button" data-savemiss="${esc(p.id)}">Скачать Word${VOTE.includes(p.council)?' + формы 1–3':''}</button>`:''}</div>`)}
  if(x=g('[data-copymiss]'))return copy($('#misstxt').textContent);
  if(x=g('[data-savemiss]')){const p=P(x.dataset.savemiss);const need=new Set(missingOf(p).docs.filter(r=>r.form).map(r=>r.form));const forms=[1,2,3].filter(n=>need.has(n)).map(n=>FORMS[n](p));return saveDoc('Недостающее_'+(p.fam||'')+'.doc',[missHead('Перечень недостающих документов')+missingBlock(p)+missFoot(),...forms].join(PB))}
  if(x=g('[data-addmeet]'))return meetForm();
  if(x=g('[data-editmeet]'))return meetForm(S.meet.find(m=>m.id===x.dataset.editmeet));
  if(x=g('[data-agenda]'))return agendaForm(curM(),+x.dataset.agenda);
  if(x=g('[data-proto]'))return protoForm(S.meet.find(m=>m.id===x.dataset.proto));
  if(x=g('[data-copyproto]')){const d=document.createElement('div');d.innerHTML=protoHtml(S.meet.find(y=>y.id===x.dataset.copyproto));return copy(d.innerText)}
  if(x=g('[data-saveproto]')){const m=S.meet.find(y=>y.id===x.dataset.saveproto);return saveDoc('Протокол_УС_'+(m.n||'')+'.doc',protoHtml(m))}
  if(x=g('[data-copytxt]'))return copy(x.dataset.copytxt==='inv'?inviteText(curM()):apprText(curM()));
  if(x=g('[data-markall]')){const m=curM(),u={};invitees().forEach(p=>{if(!m.invited?.[p.id])u[p.id]=today()});if(Object.keys(u).length)await mupd({invited:u});return}
  if(x=g('[data-appr]')){const m=curM();if((m.appr?.[x.dataset.appr]?.st||'none')!==x.dataset.v)await mupd({appr:{[x.dataset.appr]:{st:x.dataset.v,date:today()}},...(x.dataset.v==='sent'&&m.status!=='signed'?{status:'appr'}:{})});return}
  if(x=g('[data-mrmf]')){const f=[...(curM().files||[])];f.splice(+x.dataset.mrmf,1);await mupd({files:f});return}
  if(x=g('[data-rq]')){const id=route()[1],p=P(id);if(!p||rs(p,x.dataset.rq)===x.dataset.v)return;await save(()=>db.doc('people/'+id).update({req:{[x.dataset.rq]:{st:x.dataset.v,date:x.dataset.v==='none'?'':today()}}}));return}
  if(x=g('[data-rmf]')){const p=P(route()[1]),k=x.dataset.rmf,f=[...(p.req?.[k]?.files||[])];f.splice(+x.dataset.i,1);await save(()=>db.doc('people/'+p.id).update({req:{[k]:{files:f}}}));return}
  if(x=g('[data-addstep]')){const i=$('#newstep');if(i.value.trim()){F.steps.push({t:i.value.trim(),done:false});i.value='';$('#steps').innerHTML=stepsHtml()}return}
  if(x=g('[data-rmstep]')){F.steps.splice(+x.dataset.rmstep,1);$('#steps').innerHTML=stepsHtml();return}
  if(x=g('[data-rmfile]')){F.files.splice(+x.dataset.rmfile,1);$('#files').innerHTML=filesHtml();return}
  if(g('a')||g('label')||g('input')||g('select'))return;
  if(x=g('[data-del]')){const f=$('#fm');if(x.dataset.sure){await save(()=>db.doc(x.dataset.del+'/'+f.dataset.id).delete());if(x.dataset.del==='people')location.hash='docs';if(x.dataset.del==='meetings')location.hash='zasedaniya';return close()}x.dataset.sure=1;x.textContent='Точно удалить?';return}
  if(x=g('[data-go]')){location.hash=x.dataset.go;return}
  if(x=g('[data-e]'))return evForm(S.ev.find(p=>p.id===x.dataset.e));
  if(x=g('[data-t]'))return taskForm(S.tasks.find(p=>p.id===x.dataset.t));
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newstep'){e.preventDefault();$('[data-addstep]').click()}});
async function uploadAll(list,onOne){for(const file of list){try{const r=await assets.upload(file);await onOne({id:r.id,name:file.name})}catch(e){toast('Не загрузилось: '+file.name+' (PDF или фото до 20 МБ)')}}}
document.addEventListener('change',async ev=>{const t=ev.target;
  if(t.dataset.step!==undefined){F.steps[+t.dataset.step].done=t.checked;$('#steps').innerHTML=stepsHtml();return}
  if(t.id==='logoup'){const f=t.files[0];if(!f)return;try{const r=await assets.upload(f);BR={...BR,logo:r.id};await save(()=>db.doc('settings/brand').set(BR));brand();toast('Логотип загружен')}catch(e){toast('Не удалось загрузить логотип')}return}
  if(t.id==='up'){$('#upmsg').textContent='Загружаю…';await uploadAll(t.files,async f=>{F.files.push(f);$('#files').innerHTML=filesHtml()});$('#upmsg').textContent='Готово — нажмите «Сохранить».';t.value='';return}
  if(t.dataset.upk){const k=t.dataset.upk,id=route()[1];toast('Загружаю…');const got=[];await uploadAll(t.files,async f=>{got.push(f)});const p=P(id);if(got.length){await save(()=>db.doc('people/'+id).update({req:{[k]:{files:[...(p.req?.[k]?.files||[]),...got],st:'got',date:today()}}}));toast('Скан прикреплён — «получено»')}t.value='';return}
  if(t.dataset.inv){await mupd({invited:{[t.dataset.inv]:t.checked?today():''}});return}
  if(t.dataset.present){await mupd({present:{[t.dataset.present]:t.checked}});return}
  if(t.dataset.rem!==undefined){await mupd({appr:{[t.dataset.rem]:{comment:t.value}}});return}
  if(t.dataset.mstatus){await save(()=>db.doc('meetings/'+t.dataset.mstatus).update({status:t.value}));return}
  if(t.dataset.mup!==undefined){toast('Загружаю…');const got=[];await uploadAll(t.files,async f=>{got.push(f)});if(got.length)await mupd({files:[...(curM().files||[]),...got],status:'signed'});toast('Протокол прикреплён');t.value='';return}
  if(t.dataset.tg){const v=Math.max(0,parseInt(t.value)||0);if(v!==T[t.dataset.tg]){T={...T,[t.dataset.tg]:v};await save(()=>db.doc('settings/targets').set(T))}return}
  if(t.dataset.ts){const x=S.tasks.find(y=>y.id===t.dataset.ts);if(x&&x.status!==t.value)await save(()=>db.doc('tasks/'+x.id).update({status:t.value}))}
});
document.addEventListener('submit',async ev=>{const f=ev.target;if(f.id!=='agf'&&!f.dataset.kind)return;ev.preventDefault();
  if(f.id==='agf'){const fd=new FormData(f),m=S.meet.find(y=>y.id===f.dataset.mid),ag=JSON.parse(JSON.stringify(m.agenda||[])),i=+f.dataset.i;for(const k of ['speaker','heard','decided','za','protiv','vozd'])ag[i][k]=String(fd.get(k)||'').trim();await save(()=>db.doc('meetings/'+m.id).update({agenda:ag}));toast('Сохранено');return close()}
  const fd=new FormData(f),k=f.dataset.kind,id=f.dataset.id;
  if(k==='meet'){const old=S.meet.find(y=>y.id===id);const agenda=String(fd.get('agenda')||'').split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const [t,sp]=l.split('|').map(s=>s.trim());const prev=(old?.agenda||[]).find(a=>a.t===t)||{};return {...prev,t,speaker:sp||prev.speaker||''}});const o={n:String(fd.get('n')||'').trim(),date:fd.get('date')||'',time:fd.get('time')||'',zoom:String(fd.get('zoom')||'').trim(),agenda};const ref=id?db.doc('meetings/'+id):db.collection('meetings').doc();await save(()=>id?ref.update(o):ref.set({...o,status:'plan',invited:{},present:{},appr:{},files:[]}));toast('Сохранено');if(!id){$('#ov').classList.remove('on');location.hash='m-'+ref.id;return}return close()}
  const o={};for(const [a,b] of fd.entries())if(a!=='a'&&a!=='akk'&&!(b instanceof File))o[a]=String(b).trim();
  let col;
  if(k==='person'){col='people';o.akk=fd.has('akk')}
  if(k==='ev'){col='evidence';o.authors=fd.getAll('a');o.steps=F.steps;o.files=F.files;if(o.kind!=='pub')delete o.cat}
  if(k==='task'){col='tasks';const old=S.tasks.find(t=>t.id===id);o.n=old?.n??(S.tasks.length+1);o.steps=F.steps;o.files=F.files}
  const ref=id?db.doc(col+'/'+id):db.collection(col).doc();
  await save(()=>id&&k==='person'?ref.update(o):ref.set(o));
  if(k==='person'&&!id)location.hash='p-'+ref.id;
  toast('Сохранено');close();
});
async function save(fn){if(!db)return toast('Нет связи с данными');try{await fn()}catch(e){if(e?.code==='invalid_argument'){canW=false;render()}toast('Не удалось сохранить: доступ только на просмотр или нет связи')}}

// ---------- данные
(async()=>{
  brand();render();
  db=await claude.use('db');
  if(!db){$('#msg').textContent='нет связи с базой';return}
  assets=await claude.use('assets');dl=await claude.use('downloads');
  const u=await claude.use('user');try{const w=u&&await u.can('data.write');if(w===false)canW=false}catch(e){}
  brand();
  const timer=setTimeout(()=>{if(loaded<4)$('#msg').textContent='данные пока не загрузились'},10000);
  const seen={},rr=()=>{if(!$('#ov').classList.contains('on'))render()};
  db.doc('settings/sender').onSnapshot(s=>{if(s.exists)SND={name:'',...s.data()}},()=>{});
  db.doc('settings/brand').onSnapshot(s=>{BR=s.exists?{...s.data()}:{};brand()},()=>{});
  db.doc('settings/targets').onSnapshot(s=>{T={...RULE,...(s.exists?s.data():{})};rr()},()=>{});
  const ord='chair vice member secretary none';
  const sub=(col,key)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key==='people')S.people.sort((a,b)=>(ord.indexOf(a.council||'none')-ord.indexOf(b.council||'none'))||(a.fam||'').localeCompare(b.fam||'','ru'));if(!s.metadata.fromCache&&!seen[key]){seen[key]=1;loaded++;if(loaded>=4){clearTimeout(timer);$('#msg').textContent=''}}rr()},()=>{clearTimeout(timer);$('#msg').textContent='связь прервалась — обновите страницу'});
  sub('people','people');sub('evidence','ev');sub('tasks','tasks');sub('meetings','meet');
})();
}
